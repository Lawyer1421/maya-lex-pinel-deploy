name: grokbot-audit

# NO ejecuta ninguna auditoría automática ni bloquea el merge. Grokbot (Auditor
# DevOps) es un revisor externo humano-en-el-loop; su dictamen vive en los
# comentarios del PR. El label `auditor-green` no se añade por regla, así que
# este check ya no lo exige: siempre pasa y, si el label falta, deja un aviso
# visible (::warning::) en el resumen del run.
#
# Se conserva el nombre del job `auditor-gate` porque la guía de protección de
# rama (docs/runbooks/branch-protection-setup.md) lo lista como check requerido;
# eliminar el workflow lo dejaría pendiente para siempre.

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  auditor-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Aviso informativo sobre 'auditor-green'
        run: |
          if [ "${{ contains(github.event.pull_request.labels.*.name, 'auditor-green') }}" = "true" ]; then
            echo "auditor-green presente."
          else
            echo "::warning::Sin label 'auditor-green'. Aviso informativo: el dictamen del Auditor DevOps está en los comentarios del PR; este check no bloquea."
          fi
